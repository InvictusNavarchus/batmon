name: Release

# A pushed v* tag builds every target, then publishes the release with its
# assets already attached and its notes taken from CHANGELOG.md. Publishing
# last is the point: install.sh downloads from releases/latest/, which moves
# to a release the moment it goes public — if its binaries are not there yet,
# the one-line installer 404s until they are.
#
# Push the tag with `cargo release <level> -x`. Do not create the release in
# the web UI: the publish job creates it, resumes drafts, and rejects published
# releases.
#
# A manual run builds the matrix only — a rehearsal, never a release.
#
# The full release process is in docs/releasing.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify package version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match Cargo version $version."
            exit 1
          fi

      - name: Test
        run: cargo test --locked

  build-release:
    needs: validate
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            use_cross: false
          - target: aarch64-unknown-linux-musl
            use_cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: ${{ !matrix.use_cross }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: ${{ matrix.use_cross }}
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package archive
        run: |
          BIN="target/${{ matrix.target }}/release/batmon"
          ARCHIVE="batmon-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE" -C "$(dirname "$BIN")" batmon
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      # Hand the archive to the publish job rather than attaching it here, so
      # no target is ever on a public release before every target has built.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: batmon-${{ matrix.target }}
          path: |
            batmon-${{ matrix.target }}.tar.gz
            batmon-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Assemble a resumable draft, then flip it public after every upload:
      # the release never exists publicly without its binaries.
      # release-notes.sh fails on a missing or empty section, which stops the
      # job before anything is created.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          scripts/release-notes.sh "${TAG#v}" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::$TAG is already published; refusing to replace its assets."
              exit 1
            fi
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file notes.md
          fi

          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false

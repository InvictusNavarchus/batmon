# cargo-release configuration, replacing the release-it setup that went with
# package.json. How to cut a release, and what each step does, is in
# docs/releasing.md; the comments here explain individual settings.
#
# The version lives only in Cargo.toml now; nothing else needs to be kept in
# step with it.

# Match the commit and tag conventions the repository already used.
pre-release-commit-message = "chore(release): bump version to v{{version}}"
tag-name = "v{{version}}"
tag-message = "Release v{{version}}"

# Not a crates.io package — this ships as a binary built from source.
publish = false

push = true
sign-commit = true
sign-tag = true

# Refuse to release from a branch other than master, or with a dirty tree.
allow-branch = ["master"]

# Roll the pending notes into a dated section inside the release commit.
# Match exactly one heading and comparison-link definition; mentions of
# Unreleased or ReleaseDate in prose are left untouched.
pre-release-replacements = [
  { file = "CHANGELOG.md", search = '(?m)^## \[Unreleased\]$', replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1, prerelease = true },
  { file = "CHANGELOG.md", search = '(?m)^\[Unreleased\]: .*$', replace = "[Unreleased]: {{repository}}/compare/{{tag_name}}...HEAD\n[{{version}}]: {{repository}}/compare/v{{prev_version}}...{{tag_name}}", exactly = 1, prerelease = true },
]

# Refuse to release with nothing under the heading, since that section is the
# release notes. The hook runs after the replacements but also during a dry
# run, which does not write them — so the section to check is still called
# Unreleased in a preview and already renamed in a real run.
pre-release-hook = [
  "sh", "-c",
  'if [ "$DRY_RUN" = true ]; then v=Unreleased; else v="$NEW_VERSION"; fi; scripts/release-notes.sh "$v" >/dev/null',
]

# GitHub releases are not created here. cargo-release stops at the pushed tag;
# .github/workflows/release.yml builds from it and publishes the release, with
# that version's CHANGELOG.md section as the notes.

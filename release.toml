# cargo-release configuration, replacing the release-it setup that went with
# package.json.
#
#   cargo install cargo-release
#
#   cargo release minor        # previews only — cargo-release is dry-run by default
#   cargo release minor -x     # -x/--execute is what actually performs it
#
# Substitute patch or major for minor. The dry run is not optional politeness:
# there are no interactive prompts, so --execute is the confirmation step, and
# running without it is the single most common way to conclude nothing happened.
#
# The version lives only in Cargo.toml now; nothing else needs to be kept in
# step with it.

# Match the commit and tag conventions the repository already used.
pre-release-commit-message = "chore(release): bump version to v{{version}}"
tag-name = "v{{version}}"
tag-message = "Release v{{version}}"

# Not a crates.io package — this ships as a binary built from source.
publish = false

push = true
sign-tag = false

# Refuse to release from a branch other than master, or with a dirty tree.
allow-branch = ["master"]

# GitHub releases are not created here. cargo-release stops at the tag; publish
# the release from it with:
#
#   gh release create "v$(cargo pkgid | sed 's/.*#//')" --generate-notes

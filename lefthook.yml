pre-commit:
  parallel: false
  piped: true
  jobs:
    - name: cargo-fmt
      glob: "{*.rs,Cargo.toml}"
      run: cargo fmt --all
      stage_fixed: true
    - name: cargo-clippy
      glob: "{*.rs,Cargo.toml,Cargo.lock}"
      run: cargo clippy --all-targets --all-features -- -D warnings
    - name: cargo-test
      glob: "{*.rs,Cargo.toml,Cargo.lock}"
      run: cargo test --quiet
